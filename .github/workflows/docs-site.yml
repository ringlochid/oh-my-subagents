name: Public documentation

on:
    pull_request:
        paths:
            - "docs/**"
            - "docs-internal/operations/public-documentation.md"
            - "examples/workflows/**"
            - "scripts/docs/**"
            - "tests/unit/docs_site/**"
            - "console/public/assets/oms-mark.svg"
            - "mkdocs.yml"
            - "Makefile"
            - ".github/workflows/docs-site.yml"
    push:
        branches: [main]
        paths:
            - "docs/**"
            - "examples/workflows/**"
            - "scripts/docs/**"
            - "tests/unit/docs_site/**"
            - "console/public/assets/oms-mark.svg"
            - "mkdocs.yml"
            - "Makefile"
            - ".github/workflows/docs-site.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: docs-site-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: scripts/docs/site/requirements.txt
            - name: Install pinned website dependencies
              run: make docs-site-install
            - name: Build and check public pages
              run: make docs-site-check
            - name: Upload verified website
              if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: build/docs-site
    deploy:
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        needs: build
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - name: Deploy verified artifact
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
